# Render Blueprint — one web service that builds the React app and serves it from Express.
# Dashboard > New > Blueprint, pick this repo. Secrets marked sync:false are asked for on creation.
services:
  - type: web
    name: 2syria
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL
        sync: false
      - key: USER_NAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SIMILARITY_URL
        sync: false
      - key: SERVER_TOKEN
        sync: false
      - key: AI_TIMEOUT_MS
        value: "60000"
      - key: KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
